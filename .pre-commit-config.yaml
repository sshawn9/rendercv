repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
  - repo: local
    hooks:
      - id: codespell
        name: codespell
        language: system
        entry: uv run --frozen --no-default-groups --group dev codespell
        types: [text]
        args:
          - --skip=src/rendercv/schema/models/locale/other_locales/*
          - --exclude-file=schema.json
      - id: ruff-check
        name: ruff check
        language: system
        entry: uv run --frozen --no-default-groups --group dev ruff check --force-exclude
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run --frozen --no-default-groups --group dev ruff format --force-exclude
        types_or: [python, pyi, jupyter]
      - id: ty-check
        name: ty check
        language: system
        entry: uv run --frozen --no-default-groups --group dev ty check src tests
        pass_filenames: false
        args: [--python=.venv/]
